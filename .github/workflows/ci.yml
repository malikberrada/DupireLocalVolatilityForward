name: Reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the locked CPU environment
        run: python -m pip install -r requirements-lock.txt
      - name: Install this source tree
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Check tests
        run: python -m pytest -q --junitxml=runs/pytest.xml
      - name: Reproduce from original raw data
        run: python scripts/reproduce.py --profile core --out runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: runs/
